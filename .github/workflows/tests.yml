# Python and JavaScript must agree: both suites, and the shared vectors must be current (py/tests/test_vectors.py).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "22"
      - run: pip install -e "py[fast]"
      - name: The docs build, and their generated and ledger pages are current (published to ledgdex.github.io/docs)
        run: python guide/build.py --check --gen && git diff --exit-code guide && test -z "$(git status --porcelain guide)"
      - name: The viewer builds (published to ledgdex.github.io/viewer/ with "cd viewer && python run.py")
        run: cd viewer && python run.py --build-only && git diff --exit-code . && test -z "$(git status --porcelain .)"
      - name: The home pages build (published to ledgdex.github.io with "cd home && python run.py")
        run: cd home && python run.py --build-only && git diff --exit-code . && test -z "$(git status --porcelain .)"
      - name: Python (cryptography backend)
        run: cd py && python -m unittest discover -s tests -v
      - name: Python (pure Ed25519, no verification cache)
        run: cd py && LEDGDEX_PURE=1 LEDGDEX_NO_CACHE=1 python -m unittest discover -s tests
      - name: JavaScript against the shared vectors
        run: node js/test.mjs
      - name: Differential fuzzing (a new seed every run; rerun one with --seed N)
        run: cd py && python tests/fuzz.py --seed ${{ github.run_number }} --ledgers 200 --texts 3000 --keep fuzz-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: fuzz-differences
          path: py/fuzz-out/
          if-no-files-found: ignore
